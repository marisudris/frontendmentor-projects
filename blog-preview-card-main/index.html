<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="visually-hidden">
    <h1>Blog preview card</h1>
  </header>
  <main>
    <section class="card">
      <div class="card-content">
        <h2 class="card-title">HTML & CSS foundations</h2>
        <p class="card-description">These languages are the backbone of every website, defining structure, content, and
          presentation.</p>
        <span class="card-tag">Learning</span>
        <p class="card-date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
      </div>
      <img src="assets/images/illustration-article.svg" alt="an abstract illustration with a closed tag symbol"
        class="card-img">
      <p class="card-author">
        <img class="card-author-avatar" src="assets/images/image-avatar.webp" alt="portrait of Greg Hooper">
        <span class="card-author-name">Greg Hooper</span>
      </p>
    </section>
  </main>
  <footer class="attribution visually-hidden">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
