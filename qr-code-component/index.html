<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | QR code component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="visually-hidden">
    <h1>QR Code Component</h1>
  </header>
  <main>
    <section class="card">
      <img src="./images/image-qr-code.png" alt="QR Code" class="card-img">
      <div class="card-content">
        <h2 class="card-title">Improve your front-end skills by building projects</h2>
        <p class="card-description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next
          level</p>
    </section>
    </div>
  </main>
  <footer class="attribution visually-hidden">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
